name: Publish Package
# Ref: https://github.com/azu/lerna-monorepo-github-actions-release/blob/master/.github/workflows/publish.yml

on:
  push:
    branches:
      - "**"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  # ── E2E tests ──────────────────────────────────────────────────
  # Runs inside the official Playwright image so the browsers are
  # pre-installed — this avoids the `playwright install` hang on
  # Node 24 (fixed in Playwright >= 1.60.0) and skips the download.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: 💿 Install packages
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build packages
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧪 Run E2E tests
        run: pnpm test:e2e
        env:
          HOME: /root # ensure Playwright finds the pre-baked browsers

  build-and-publish:
    runs-on: ubuntu-latest
    needs: e2e # only publish/deploy once the e2e suite passes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to retrieve git history
      - name: Set up Volta
        uses: volta-cli/action@v3
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: 💿 Install packages
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build packages
        run: pnpm clean && pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Stable release (main/master only) ──────────────────────────

      # Define ${CURRENT_VERSION}
      - name: Set Current Version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash -ex {0}
        run: |
          CURRENT_VERSION=$(node -p 'require("./lerna.json").version')
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV

      - name: Tag Check
        id: tag_check
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash -ex {0}
        run: |
          GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${CURRENT_VERSION}"
          http_status_code=$(curl -LI $GET_API_URL -o /dev/null -w '%{http_code}\n' -s \
            -H "Authorization: token ${GITHUB_TOKEN}")
          if [ "$http_status_code" -ne "404" ] ; then
            echo "exists_tag=true" >> $GITHUB_OUTPUT
          else
            echo "exists_tag=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.tag_check.outputs.exists_tag == 'false' && github.event.pull_request.merged == true
        run: |
          gh release create "v${{ env.CURRENT_VERSION }}" \
            --title "${{ github.event.pull_request.title }}" \
            --notes "${{ github.event.pull_request.body }}" \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Publish stable release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git stash
          pnpm -r --filter './packages/*' exec npm publish --access public --provenance

      # ── Canary release (non-main branches) ─────────────────────────

      - name: 📢 Publish canary release
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          git stash
          SHORT_SHA=$(git rev-parse --short HEAD)
          pnpm -r --filter './packages/*' exec bash -c "npm version prerelease --preid ci.${SHORT_SHA} --no-git-tag-version && npm publish --access public --provenance --tag ci"

      # ── Docs deployment (main/master only) ─────────────────────────

      - name: 📄Upload built docs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/docs/build

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: 📄Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
